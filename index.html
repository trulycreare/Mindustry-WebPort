<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindustry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Mindustry JVM...</h2>
        <p>Please wait, fetching game environment.</p>
    </div>
    
    <div id="container"></div>

    <!-- 1. Load CheerpJ 3.0 Loader Directly -->
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>

    <!-- 2. Execute Runner Script After Loader Finishes -->
    <script>
        async function launchMindustry() {
            try {
                // Verify loader loaded
                if (typeof cheerpjInit === "undefined") {
                    throw new Error("CheerpJ loader.js failed to load from CDN.");
                }

                // Initialize WASM JVM
                await cheerpjInit();

                // Create Display Canvas
                cheerpjCreateDisplay(-1, -1, document.getElementById("container"));

                // Hide Loading Text
                document.getElementById("loading").style.display = "none";

                // Run Game Jar
                await cheerpjRunJar("/app/Mindustry.jar");
            } catch (err) {
                console.error("Mindustry Launch Error:", err);
                document.getElementById("loading").innerHTML = 
                    `<h2 style="color:red;">Launch Failed</h2><p>${err.message}</p>`;
            }
        }

        // Wait for page load to ensure CheerpJ is globally available
        window.addEventListener("load", launchMindustry);
    </script>
</body>
</html>
