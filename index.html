<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindustry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Mindustry JVM...</h2>
        <p>Please wait, fetching game environment.</p>
    </div>
    
    <div id="container"></div>

    <!-- CheerpJ 4.3 WebAssembly Loader -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js" crossorigin="anonymous"></script>

    <script>
        async function launchMindustry() {
            try {
                if (typeof cheerpjInit === "undefined") {
                    throw new Error("CheerpJ loader.js was blocked or failed to download from the 4.3 CDN endpoint.");
                }

                // Initialize WebAssembly JVM Environment
                await cheerpjInit();

                // Create full-window Display Canvas
                cheerpjCreateDisplay(-1, -1, document.getElementById("container"));

                // Hide Loading Text Overlay
                document.getElementById("loading").style.display = "none";

                // Execute the Mindustry Fat JAR
                await cheerpjRunJar("/app/Mindustry.jar");
            } catch (err) {
                console.error("Mindustry Launch Error:", err);
                document.getElementById("loading").innerHTML = 
                    `<h2 style="color:#ff4444;">Launch Failed</h2><p style="margin-top:10px;">${err.message}</p>`;
            }
        }

        // Wait for page load to ensure CheerpJ CDN script is processed
        window.addEventListener("load", launchMindustry);
    </script>
</body>
</html>
